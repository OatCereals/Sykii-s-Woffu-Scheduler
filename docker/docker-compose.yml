services:
  woffu:
    build: .
    image: kinkyscheduler:latest
    container_name: kinkyscheduler
    restart: unless-stopped
    # Internal only — Caddy publishes HTTPS on the host.
    expose:
      - "5000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WOFFU_HOST: ${WOFFU_HOST:-0.0.0.0}
      WOFFU_PORT: ${WOFFU_PORT:-5000}
      SECRET_KEY: ${SECRET_KEY:-}
      REGISTER_CODE: ${REGISTER_CODE:-aleksejsisblin}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: kinkyscheduler-caddy
    restart: unless-stopped
    ports:
      # Host HTTPS port (default 7680). Must use https:// in the browser.
      - "${PUBLISH_PORT:-7680}:7680"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - woffu
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  caddy_data:
  caddy_config:
