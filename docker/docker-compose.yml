services:
  woffu:
    build: .
    image: woffu-scheduler:latest
    container_name: woffu-scheduler
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WOFFU_HOST: ${WOFFU_HOST:-0.0.0.0}
      WOFFU_PORT: ${WOFFU_PORT:-5000}
      WOFFU_USERNAME: ${WOFFU_USERNAME:-}
      WOFFU_PASSWORD: ${WOFFU_PASSWORD:-}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
