services:
  woffu:
    build: .
    image: kinkyscheduler:latest
    container_name: kinkyscheduler
    restart: unless-stopped
    ports:
      - "40:40"
    environment:
      TZ: ${TZ:-Europe/Madrid}
      WOFFU_HOST: ${WOFFU_HOST:-0.0.0.0}
      WOFFU_PORT: ${WOFFU_PORT:-40}
      SECRET_KEY: ${SECRET_KEY:-}
      REGISTER_CODE: ${REGISTER_CODE:-aleksejsisblin}
    volumes:
      - ./data:/app/data
    # Port 40 needs root (or NET_BIND_SERVICE). Entrypoint stays root for ports < 1024.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
